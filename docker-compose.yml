services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: my_website
      MYSQL_USER: user
      MYSQL_PASSWORD: "123456"
      MYSQL_ROOT_PASSWORD: "123456"
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "9906:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: "docker-dev-secret"
      DJANGO_DEBUG: "1"
      DB_NAME: my_website
      DB_USER: user
      DB_PASSWORD: "123456"
      DB_HOST: db
      DB_PORT: "3306"
    ports:
      - "8088:8088"
    command: sh -c "python manage.py migrate && daphne -b 0.0.0.0 -p 8088 MyWebsiteBackend.asgi:application"

volumes:
  mysql_data:
